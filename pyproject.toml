[project]
name = "tokidx"
version = "0.1.0"
description = "A reference implementation of a token price benchmark for LLM inference"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13.7"]

[project.scripts]
tokidx = "tokidx.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokidx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ARG", "SIM", "C4"]
ignore = [
    # Typer's whole interface is Option()/Argument() in defaults.
    "B008",
    # Long lines are almost always prose in a docstring or a table.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures legitimately take arguments they only forward.
"tests/*" = ["ARG001", "ARG005"]
